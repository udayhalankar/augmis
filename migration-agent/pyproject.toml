[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "migration-agent"
version = "0.1.0"
description = "Local-first migration agent for scanning customer folders and reporting to the backend"
requires-python = ">=3.11"

[project.scripts]
migration-agent = "migration_agent.__main__:main"
migration-agent-service = "migration_agent.windows_service:main"
migration-agent-ui = "migration_agent.gui:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
windows-service = ["pywin32>=306"]
